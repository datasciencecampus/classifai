---
name: CI
permissions:
  pull-requests: write
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches-ignore:
      - 'dependabot/**/**'
    types: [opened, synchronize, reopened, edited, ready_for_review]
concurrency:
  group: "${{ github.head_ref || github.ref }}-${{ github.workflow }}"
  cancel-in-progress: true

jobs:
  lint-test:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    name: Lint and Test
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: PR Conventional Commit Validation
        if: |
          github.event_name == 'pull_request' &&
          (github.event.action == 'opened' ||
          github.event.action == 'synchronize' ||
          github.event.action == 'reopened' ||
          github.event.action == 'edited') &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'dependabot-preview[bot]'
        uses: ytanikin/pr-conventional-commits@8267db1bacc237419f9ed0228bb9d94e94271a1d # v1.4.0
        with:
          task_types: '["feat","fix","docs","test","ci","refactor","perf","chore","revert"]'
          custom_labels: '{"feat": "enhancement", "fix": "bug", "docs": "documentation", "test": "test", "ci": "CI/CD", "refactor": "refactor", "perf": "performance", "chore": "chore", "revert": "revert", "wip": "WIP"}'
          add_scope_label: 'false'
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
      - name: Install uv
        uses: astral-sh/setup-uv@cec208311dfd045dd5311c1add060b2062131d57  # v8.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Display Python version
        run: python -c "import sys; print(sys.version)"

      - name: Build uv lock file
        run: uv lock

      - name: Install dependencies
        run: uv sync

      #- name: setup gitleaks
      #  run: make setup-gitleaks

      #- name: run gitleaks
      #  run: make run-gitleaks

      - name: check code formatting & vulnerability detection
        run: make check-python-nofix

      - name: Cleanup residue file
        run: make clean
